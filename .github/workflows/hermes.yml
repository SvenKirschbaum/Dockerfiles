name: Hermes Image

on:
  pull_request:
    paths:
      - hermes/**
      - .github/workflows/hermes.yml
      - .github/workflows/docker-image.yml
  push:
    branches:
      - main
    paths:
      - hermes/**
      - .github/workflows/hermes.yml
      - .github/workflows/docker-image.yml
  workflow_dispatch:

jobs:
  docker-image:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-image.yml
    with:
      image: hermes
      context: hermes
      version_offset: 0
      push_latest: false
    secrets: inherit
